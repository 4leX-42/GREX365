name: CI

on:
  push:
    branches: [main, grex365-2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
          include-prerelease: true

      - name: Restore Core
        run: dotnet restore src/Grex365.Core/Grex365.Core.csproj

      - name: Restore PowerShell
        run: dotnet restore src/Grex365.PowerShell/Grex365.PowerShell.csproj

      - name: Restore App
        run: dotnet restore src/Grex365.App/Grex365.App.csproj

      - name: Restore Tests
        run: dotnet restore tests/Grex365.Core.Tests/Grex365.Core.Tests.csproj

      - name: Build App (transitively builds Core + PowerShell)
        run: dotnet build src/Grex365.App/Grex365.App.csproj --configuration Release --no-restore

      - name: Restore sample plugin
        run: dotnet restore samples/Grex365.SamplePlugin/Grex365.SamplePlugin.csproj

      - name: Build sample plugin
        run: dotnet build samples/Grex365.SamplePlugin/Grex365.SamplePlugin.csproj --configuration Release --no-restore

      - name: Upload sample plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grex365.SamplePlugin
          path: samples/Grex365.SamplePlugin/bin/Release/net10.0-windows/Grex365.SamplePlugin.dll

      - name: Test
        run: dotnet test tests/Grex365.Core.Tests/Grex365.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
          include-prerelease: true

      - name: Publish portable single-file EXE
        run: >
          dotnet publish src/Grex365.App/Grex365.App.csproj
          -c Release
          -p:PublishProfile=win-x64-portable
          -o publish

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Grex365-${{ github.ref_name }}-portable
          # AssemblyName=Grex365 (no Grex365.App) desde el rename del assembly
          path: publish/Grex365.exe

  msix:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
          include-prerelease: true

      - name: Resolve MSIX version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $raw = $tag -replace '^v',''
          $parts = $raw.Split('-')[0].Split('.')
          while ($parts.Length -lt 4) { $parts += '0' }
          $version = ($parts[0..3] -join '.')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MSIX version: $version"

      - name: Build MSIX
        shell: pwsh
        run: pwsh -File packaging/msix/Build-Msix.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Sign MSIX (optional)
        if: env.SIGN_CERT_PFX_B64 != ''
        shell: pwsh
        env:
          SIGN_CERT_PFX_B64: ${{ secrets.SIGN_CERT_PFX_B64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX_B64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 packaging/msix/out/Grex365.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx -Force

      - name: Render AppInstaller manifest
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $feed = '${{ vars.MSIX_FEED_BASE_URI }}'
          if (-not $feed) { $feed = 'https://example.invalid/grex365' }
          $src = Get-Content packaging/msix/Grex365.appinstaller -Raw
          $rendered = $src.Replace('{{FEED_BASE_URI}}', $feed).Replace('{{VERSION}}', $version)
          $dst = 'packaging/msix/out/Grex365.appinstaller'
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          Set-Content -Path $dst -Value $rendered -NoNewline -Encoding utf8

      - name: Upload MSIX bundle
        uses: actions/upload-artifact@v4
        with:
          name: Grex365-${{ github.ref_name }}-msix
          path: |
            packaging/msix/out/Grex365.msix
            packaging/msix/out/Grex365.appinstaller

  velopack:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
          include-prerelease: true

      - name: Resolve semver from tag
        id: ver
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Velopack version: $version"

      - name: Build Velopack release (installer + full/delta packages)
        shell: pwsh
        run: pwsh -File packaging/velopack/Build-Velopack.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload Velopack bundle
        uses: actions/upload-artifact@v4
        with:
          name: Grex365-${{ github.ref_name }}-velopack
          path: packaging/velopack/out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, msix, velopack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: Grex365-${{ github.ref_name }}-portable
          path: artifacts/portable

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: Grex365-${{ github.ref_name }}-msix
          path: artifacts/msix

      - name: Download Velopack artifact
        uses: actions/download-artifact@v4
        with:
          name: Grex365-${{ github.ref_name }}-velopack
          path: artifacts/velopack

      - name: Render release body
        id: body
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          anchor=$(echo "$tag" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          sed -e "s|\${TAG_NAME}|$tag|g" -e "s|\${TAG_NAME_ANCHOR}|$anchor|g" \
            .github/release-template.md > rendered-body.md
          {
            echo 'body<<EOF'
            cat rendered-body.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GREX365 ${{ github.ref_name }}
          body: ${{ steps.body.outputs.body }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/portable/Grex365.exe
            artifacts/msix/Grex365.msix
            artifacts/msix/Grex365.appinstaller
            artifacts/velopack/*
